services:
  - type: web
    name: sonify-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_HOST
        value: 0.0.0.0
      - key: MODEL_DEVICE
        value: cpu
      - key: MODEL_RUNTIME
        value: pytorch
      - key: PUBLIC_DEPLOYMENT
        value: "true"
      - key: FRONTEND_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SONIFY_OPENAI_VISION_MODEL
        value: gpt-5.6-sol
      - key: SONIFY_OPENAI_IMAGE_MODEL
        value: gpt-image-2
      - key: SONIFY_OPENAI_IMAGE_QUALITY
        value: medium
      - key: SONIFY_OPENAI_TIMEOUT_SECONDS
        value: "180"
