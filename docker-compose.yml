services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    volumes:
      - ./backend/runtime:/app/runtime
      - ./models:/models:ro
  frontend:
    image: node:22-bookworm-slim
    working_dir: /workspace/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
    depends_on:
      - backend
